<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>两连杆逆运动学动画</title><link rel="stylesheet" href="anim.css"></head>
<body><main>
<h1>第 2 章 · 两连杆：正逆运动学、工作空间与奇异</h1>
<p class="sub">配套讲义：<a href="../lessons/02-kinematics.html">第 2 章 · 本体与运动学：关节角怎么变成手的位置</a>。L<sub>1</sub> = 1，L<sub>2</sub> = 0.8。每帧用阻尼最小二乘迭代 30 步，让手追目标。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 420"></svg></div>
<div class="stats">
<div class="stat"><div class="l">θ₁ / θ₂</div><div class="v" id="sa">—</div></div>
<div class="stat"><div class="l">目标距离 / 外圈</div><div class="v" id="sr">—</div></div>
<div class="stat"><div class="l">det J = L₁L₂ sin θ₂</div><div class="v" id="sd">—</div></div>
<div class="stat"><div class="l">手到目标误差</div><div class="v" id="sz">—</div></div>
</div>
<div class="row ctl"><label><input type="checkbox" id="down"> 肘朝下（另一组解）</label></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 重来</button></div>
<p class="note">看点：目标沿椭圆走，有一段跑出了外圈（够不着）。这时手臂伸直贴着外圈走，det J 变红接近 0——这就是奇异：再往外的方向，关节怎么转都动不了手。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');const L1=1,L2=0.8,S=100,CX=340,CY=215;
const P=(x,y)=>[CX+x*S,CY-y*S];
el('circle',{cx:CX,cy:CY,r:(L1+L2)*S,fill:'var(--accent-bg)',opacity:.45,stroke:'var(--accent)','stroke-dasharray':'4 3'},sv);
el('circle',{cx:CX,cy:CY,r:(L1-L2)*S,fill:'var(--bg)',stroke:'var(--accent)','stroke-dasharray':'4 3'},sv);
txt('工作空间（可达圆环）',{x:CX+(L1+L2)*S*0.62,y:CY-(L1+L2)*S*0.82,class:'m'},sv);
const trail=el('polyline',{fill:'none',stroke:'var(--teal)','stroke-width':1.2,'stroke-dasharray':'2 3'},sv);
const l1=el('line',{stroke:'var(--text)','stroke-width':7,'stroke-linecap':'round'},sv);
const l2=el('line',{stroke:'var(--muted)','stroke-width':6,'stroke-linecap':'round'},sv);
el('circle',{cx:CX,cy:CY,r:8,fill:'var(--text)'},sv);
const elb=el('circle',{r:6,fill:'var(--purple)'},sv);
const hand=el('circle',{r:7,fill:'var(--warm)'},sv);
const tgt=el('circle',{r:7,fill:'none',stroke:'var(--teal)','stroke-width':3},sv);
const N=120;let k,th,tr;
const target=i=>{const a=i/N*2*Math.PI;return[0.3+1.75*Math.cos(a),0.15+1.25*Math.sin(a)]};
function fk(t){const x1=L1*Math.cos(t[0]),y1=L1*Math.sin(t[0]);return[x1,y1,x1+L2*Math.cos(t[0]+t[1]),y1+L2*Math.sin(t[0]+t[1])]}
function solve(g){for(let it=0;it<30;it++){const f=fk(th);const ex=g[0]-f[2],ey=g[1]-f[3];
  const s1=Math.sin(th[0]),c1=Math.cos(th[0]),s12=Math.sin(th[0]+th[1]),c12=Math.cos(th[0]+th[1]);
  const J=[[-L1*s1-L2*s12,-L2*s12],[L1*c1+L2*c12,L2*c12]];const lam=0.1;
  const a=J[0][0]*J[0][0]+J[0][1]*J[0][1]+lam*lam,b=J[0][0]*J[1][0]+J[0][1]*J[1][1],d=J[1][0]*J[1][0]+J[1][1]*J[1][1]+lam*lam;
  const det=a*d-b*b;const u=(d*ex-b*ey)/det,v=(-b*ex+a*ey)/det;
  let d0=J[0][0]*u+J[1][0]*v,d1=J[0][1]*u+J[1][1]*v;const m=Math.max(Math.abs(d0),Math.abs(d1));if(m>0.08){d0*=0.08/m;d1*=0.08/m}th[0]+=d0;th[1]+=d1;}}
function reset(){k=0;th=$('down').checked?[0.9,-1.2]:[0.2,1.2];tr=[];solve(target(0));draw()}
function next(){if(k>=N)return false;k++;solve(target(k));draw();return true}
function draw(){const g=target(k);const f=fk(th);
  const o=P(0,0),e=P(f[0],f[1]),h=P(f[2],f[3]),tp=P(g[0],g[1]);
  l1.setAttribute('x1',o[0]);l1.setAttribute('y1',o[1]);l1.setAttribute('x2',e[0]);l1.setAttribute('y2',e[1]);
  l2.setAttribute('x1',e[0]);l2.setAttribute('y1',e[1]);l2.setAttribute('x2',h[0]);l2.setAttribute('y2',h[1]);
  elb.setAttribute('cx',e[0]);elb.setAttribute('cy',e[1]);hand.setAttribute('cx',h[0]);hand.setAttribute('cy',h[1]);
  tgt.setAttribute('cx',tp[0]);tgt.setAttribute('cy',tp[1]);tr.push(tp);trail.setAttribute('points',tr.map(p=>p.join(',')).join(' '));
  const deg=v=>Math.round(((v*180/Math.PI)%360+540)%360-180);
  $('sa').textContent=deg(th[0])+'° / '+deg(th[1])+'°';
  const r=Math.hypot(g[0],g[1]);$('sr').textContent=r.toFixed(2)+' / 1.80';$('sr').className='v '+(r>1.8?'bad':'');
  const dj=L1*L2*Math.sin(th[1]);$('sd').textContent=dj.toFixed(3);$('sd').className='v '+(Math.abs(dj)<0.12?'bad':'good');
  $('sz').textContent=Math.hypot(g[0]-f[2],g[1]-f[3]).toFixed(3)}
$('down').onchange=()=>{ANIM.stop();reset()};
setupPlayer({captureSeed:1,reset,next},70);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
