<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">一条示范数据里该有什么：少了元数据，换一台机器人就没法用</text>
<text x="16.0" y="390.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">LeRobot Dataset：数值存 parquet、视频存 mp4，按 episode 组织；rosbag2（MCAP）原样存档，训练前再转。</text>
<rect x="30.0" y="54.0" width="380.0" height="150.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="40.0" y="72.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold">每个 episode 一次：元数据</text>
<text x="48.0" y="98.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">• 机器人型号 + URDF 版本</text>
<text x="48.0" y="119.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">• 相机内参 + 外参（装在哪）</text>
<text x="48.0" y="140.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">• 控制频率（如 50 Hz）</text>
<text x="48.0" y="161.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">• 动作的含义：关节角 / 末端位姿，绝对 / 增量</text>
<text x="48.0" y="182.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">• 任务描述（“把杯子放进水槽”）</text>
<rect x="30.0" y="220.0" width="380.0" height="136.0" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="40.0" y="238.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">每一步：每帧一行</text>
<rect x="48.0" y="248.0" width="80.0" height="26.0" rx="4" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
