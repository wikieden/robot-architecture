<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">三种停机：一样是“停”，差在怎么减速、停下后还出不出力</text>
<text x="16.0" y="340.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">STO 最快切断能量，但怎么停不受控（示意曲线）；SS1 先受控减速再断电，最常用；SS2 停住后保持出力。腿足机器人直接 STO 会摔倒。</text>
