<polyline points="770.0,180.0 770.0,224.0 420.0,224.0 420.0,180.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" opacity="1"/>
<polygon points="420.0,180.0 424.2,187.9 415.8,187.9" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="545.1" y="218.5" width="99.8" height="15.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="595.0" y="229.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="normal">电机编码器 → 速度</text>
<polyline points="790.0,180.0 790.0,254.0 240.0,254.0 240.0,180.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" opacity="1"/>
<polygon points="240.0,180.0 244.2,187.9 235.8,187.9" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="465.1" y="248.5" width="99.8" height="15.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="515.0" y="259.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="normal">输出编码器 → 位置</text>
<text x="40.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">关节里最常见的写法：τ = Kp(q* − q) + Kd(dq* − dq) + τff（dq = 关节速度；前馈抵消重力那部分）</text>
</svg>
