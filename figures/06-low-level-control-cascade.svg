<polygon points="590.0,180.0 594.2,187.9 585.8,187.9" fill="#ea580c" stroke="#ea580c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="639.8" y="190.5" width="60.5" height="15.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
