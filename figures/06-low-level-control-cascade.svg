<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">级联：三个环一层套一层，内环比外环快 5–10 倍</text>
<text x="16.0" y="320.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">内环先把快扰动（电压波动、反电动势）压掉，外环看到的是一个“听话的”下层，所以可以从里往外一层层调参。</text>
<rect x="150.0" y="56.0" width="690.0" height="210.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="160.0" y="74.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold">位置环 1 kHz</text>
<rect x="330.0" y="84.0" width="500.0" height="150.0" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="340.0" y="102.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">速度环 5–10 kHz</text>
<rect x="520.0" y="110.0" width="300.0" height="96.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="530.0" y="128.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ea580c" text-anchor="start" font-weight="bold">电流环 10–40 kHz（FOC）</text>
<rect x="20.0" y="140.0" width="90.0" height="40.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" opacity="1"/>
<text x="65.0" y="163.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">位置目标 q*</text>
<rect x="190.0" y="140.0" width="100.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/>
<text x="240.0" y="163.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">位置 P / PD</text>
<rect x="370.0" y="140.0" width="100.0" height="40.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="420.0" y="163.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">速度 PI</text>
<rect x="540.0" y="140.0" width="100.0" height="40.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<text x="590.0" y="163.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">电流 PI</text>
<rect x="700.0" y="140.0" width="100.0" height="40.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" opacity="1"/>
