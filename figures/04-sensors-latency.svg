<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">一帧画面的“年龄”：从曝光到被策略用上，几十毫秒很常见</text>
<text x="16.0" y="320.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">各段时长是示意量级。用“收到时刻”当时间戳，会把这 60 ms 全算错；要用曝光时刻（硬件时间戳）。</text>
<rect x="70.0" y="80.0" width="90.0" height="34.0" rx="4" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="115.0" y="102.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">曝光</text>
<text x="115.0" y="132.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">10 ms</text>
<rect x="160.0" y="80.0" width="72.0" height="34.0" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4" opacity="1"/>
<text x="196.0" y="102.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">读出</text>
<text x="196.0" y="132.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">8 ms</text>
<rect x="232.0" y="80.0" width="108.0" height="34.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="286.0" y="102.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">USB 传输</text>
<text x="286.0" y="132.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">12 ms</text>
<rect x="340.0" y="80.0" width="90.0" height="34.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" opacity="1"/>
<text x="385.0" y="102.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">解码</text>
<text x="385.0" y="132.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">10 ms</text>
<rect x="430.0" y="80.0" width="180.0" height="34.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<text x="520.0" y="102.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">排队 / 回调</text>
<text x="520.0" y="132.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">20 ms</text>
<line x1="115.0" y1="64.0" x2="115.0" y2="192.0" stroke="#2563eb" stroke-width="1.6"/>
<text x="115.0" y="58.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal">硬件时间戳（曝光中点）</text>
<line x1="610.0" y1="64.0" x2="610.0" y2="192.0" stroke="#dc2626" stroke-width="1.6"/>
<text x="610.0" y="58.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal">回调里“收到”的时刻</text>
<line x1="115.0" y1="154.0" x2="610.0" y2="154.0" stroke="#374151" stroke-width="1.6"/>
<polygon points="610.0,154.0 602.1,158.2 602.1,149.8" fill="#374151" stroke="#374151" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<polygon points="115.0,154.0 122.9,149.8 122.9,158.2" fill="#374151" stroke="#374151" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="313.3" y="147.0" width="98.5" height="17.0" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="362.5" y="159.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">Δt ≈ 55–60 ms</text>
<line x1="70.0" y1="248.0" x2="780.0" y2="248.0" stroke="#9ca3af" stroke-width="4"/>
<text x="70.0" y="274.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">传送带 v = 0.5 m/s</text>
<rect x="286.0" y="218.0" width="28.0" height="26.0" rx="4" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="300.0" y="212.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="normal">画面里的位置</text>
<rect x="367.0" y="218.0" width="28.0" height="26.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" opacity="1"/>
<text x="411.0" y="212.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal">此刻真实位置</text>
<line x1="316.0" y1="231.0" x2="365.0" y2="231.0" stroke="#111827" stroke-width="1.6"/>
<polygon points="365.0,231.0 357.1,235.2 357.1,226.8" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="640.0" y="236.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">e = v · Δt ≈ 0.5 × 0.06 = 3 cm</text>
<text x="640.0" y="272.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="normal">补偿：预测位置 = 观测位置 + v · Δt</text>
</svg>
